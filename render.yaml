services:
  - type: web
    name: prop-helper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn nba_app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: HOSTED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.8
